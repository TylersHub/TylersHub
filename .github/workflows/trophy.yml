name: Generate Trophy

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: TylersHub
          token: ${{ secrets.GITHUB_TOKEN }}
          # Corrected parameter names:
          file: 'trophy.svg'        # Was 'output_path'
          theme: 'alduin'
          margin-width: '10'        # Was 'margin-w'
          no-frame: 'false'

          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "🏆 Update trophy [skip ci]" && git push)   
