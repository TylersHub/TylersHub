name: Update GitHub Trophies

on:
  workflow_dispatch:

  schedule:
    # Every Sunday at 6:23 AM UTC
    - cron: "23 6 * * 0"

permissions:
  contents: write

concurrency:
  group: update-github-trophies
  cancel-in-progress: true

env:
  TROPHY_THEME: tokyonight
  TROPHY_OUTPUT: assets/github-trophies.svg

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Check out trophy generator
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: master
          path: .trophy-generator
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Hide Issues and Reviews trophies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(".trophy-generator/render_svg.ts")
          text = file.read_text()

          old = """const card = new Card(
              [],
              [],"""

          new = """const card = new Card(
              ["-Issues", "-Reviews"],
              [],"""

          if old not in text:
              raise SystemExit("Could not find the expected Card configuration.")

          file.write_text(text.replace(old, new, 1))
          PY

      - name: Generate trophy SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            .trophy-generator/render_svg.ts \
            "${{ github.repository_owner }}" \
            "$TROPHY_OUTPUT" \
            "$TROPHY_THEME"

      - name: Commit updated trophy SVG
        run: |
          if git diff --quiet -- "$TROPHY_OUTPUT" && \
             [ -z "$(git status --porcelain -- "$TROPHY_OUTPUT")" ]; then
            echo "Trophy SVG has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$TROPHY_OUTPUT"
          git commit -m "chore: update GitHub trophies"
          git push
